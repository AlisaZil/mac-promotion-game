  <style>
    :root {
      --red: #dc1f1f;
      --yellow: #fbd66e;
      --brown: #3b1a0c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--red);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phone-shaped screen, same proportions as the mockup (941 x 1672).
       Fills the height on desktop, the width on phones. */
    .screen {
      position: relative;
      width: min(100vw, 100dvh * 941 / 1672);
      aspect-ratio: 941 / 1672;
      background: var(--red);
      container-type: inline-size;
      overflow: hidden;
    }

    /* Scattered food. --x / --y are the item's centre in % of the screen,
       --w its width in % of the screen width, --r its tilt. */
    .item {
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      width: calc(var(--w) * 1cqw);
      transform: translate(-50%, -50%) rotate(calc(var(--r, 0) * 1deg));
      user-select: none;
      pointer-events: none;
    }

    .start-btn {
      position: absolute;
      left: 50%;
      top: 48.4%;
      transform: translate(-50%, -50%);
      width: 59.5cqw;
      height: 16.5cqw;
      border: 0.75cqw solid var(--brown);
      border-radius: 999px;
      background: var(--yellow);
      color: var(--brown);
      font-family: "Fredoka", system-ui, sans-serif;
      font-weight: 700;
      font-size: 7.4cqw;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .start-btn:hover { transform: translate(-50%, -50%) scale(1.04); }
    .start-btn:active { transform: translate(-50%, -50%) scale(0.97); }
  </style>
</head>
